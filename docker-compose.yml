version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: drmt_redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  drmt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drmt_server
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      # Maps local data folder to preserve SQLite DB and logs
      - ./data:/app/data
    restart: always
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://redis:6379

volumes:
  redis_data:
